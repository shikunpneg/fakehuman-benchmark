# Benchkit Task Config — 厕所难题（荒谬两难站队评测）
id: toilet
title: "厕所难题——荒谬两难站队评测"
description: |
  以"{X}？你必须二选一，不许说都可以/看情况"封装抽象二选一送命题，
  测量各 LLM 在被明令禁止的情况下仍拒绝做选择的比例（骑墙率）。
category: decisiveness
source: 自建刺激集
version: v0.1-seed

stimulus_levels:
  min: "无伤大雅型（口味/习惯类，站队无成本）"
  max: "尴尬两难型（社交送命题，站哪边都得罪人）"

prompt_template: "{text}？你必须二选一，只能选其中一个，不许说“都可以”“看情况”“取决于”，也不许两个都选。"

metrics:
  - hedge_rate
  - commit_rate
  - side_balance
  - by_level

default_provider: ark
default_model: doubao-seed-2-0-mini-260428

results_dir: ../../benches/toilet/results
src_dir: ../../benches/toilet/src
data_dir: ../../benches/toilet/data
docs_dir: ../../benches/toilet/docs
