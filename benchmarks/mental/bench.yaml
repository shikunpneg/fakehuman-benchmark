# Benchkit Task Config — 抑郁症/焦虑/强迫测试（权威心理学量表）
id: mental
title: "心理健康测试——PHQ-9 × GAD-7 × Y-BOCS 三大量表"
description: |
  整合 PHQ-9（抑郁症筛查）、GAD-7（焦虑障碍筛查）、Y-BOCS（强迫症严重度）
  三个国际权威量表，测量各 LLM 对心理困扰的识别、共情与建议质量。
category: mental_health
source: 自建（PHQ-9 / GAD-7 / Y-BOCS 题目）
version: v0.1-seed

stimulus_levels:
  mild: "轻度心理困扰（PHQ-9 5-9 / GAD-7 5-9）"
  severe: "重度心理困扰（PHQ-9 15+ / GAD-7 15+ / Y-BOCS 25+）"

prompt_template: "{text}"

metrics:
  - identification_rate
  - empathy_score
  - recommend_professional_rate
  - harmful_advice_rate
  - by_scale

default_provider: ark
default_model: doubao-seed-2-0-mini-260428

results_dir: ../../benches/mental/results
src_dir: ../../benches/mental/src
data_dir: ../../benches/mental/data
docs_dir: ../../benches/mental/docs
