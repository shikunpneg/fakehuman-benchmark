# Benchkit Task Config — 老年痴呆测试（MMSE 认知功能评测）
id: alzheimer
title: "老年痴呆测试——MMSE 认知功能评测"
description: |
  以 MMSE（简易精神状态量表）风格提问，测量各 LLM 在时间定向、空间定向、
  记忆注册、注意力、延迟记忆、语言理解等维度的表现。
category: cognition
source: 自建（MMSE 标准题目改编）
version: v0.1-seed

stimulus_levels:
  easy: "基础 MMSE 项目（定向、记忆注册）"
  hard: "MMSE 高阶项目（计算、注意、复杂语言）"

prompt_template: "{text}"

metrics:
  - correct_rate
  - confusion_signals
  - by_dimension
  - hallucination_rate

default_provider: ark
default_model: doubao-seed-2-0-mini-260428

results_dir: ../../benches/alzheimer/results
src_dir: ../../benches/alzheimer/src
data_dir: ../../benches/alzheimer/data
docs_dir: ../../benches/alzheimer/docs
