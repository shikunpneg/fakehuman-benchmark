name: Update Leaderboard

on:
  push:
    branches: [main]
    # 仅当 benchmark 结果或 benchkit 源码变更时触发
    paths:
      - 'benchmarks/**'
      - 'benchkit/*.py'
      - 'benches/**'
      - 'sbti/results/**'
      - 'sbti/docs/**'

  # 手动触发
  workflow_dispatch:

jobs:
  update-leaderboard:
    name: Regenerate Leaderboard
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写权限才能 push 更新
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 完整 checkout（含历史）以便能 push
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml python-dotenv requests

      - name: Regenerate leaderboard
        run: |
          python -m benchkit.leaderboard

      - name: Check changed files
        id: changed
        run: |
          CHANGED=$(git diff --name-only)
          echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT
          if [ -z "$CHANGED" ]; then
            echo "没有变更，退出"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "变更的文件："
            echo "$CHANGED"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git config user.name "benchkit-leaderboard-bot"
          git config user.email "benchkit@github.com"
          git add leaderboard.json LEADERBOARD.md
          git commit -m "chore: auto-update leaderboard [skip ci]"
          git push
